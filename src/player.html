<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <iframe
      id="yt"
      allow="autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const videoId = params.get('v');
      const start = params.get('start') || '0';
      const embed = new URL(`https://www.youtube-nocookie.com/embed/${videoId}`);
      embed.search = new URLSearchParams({
        autoplay: '1',
        mute: '1',
        controls: '0',
        modestbranding: '1',
        rel: '0',
        loop: '1',
        playlist: videoId,
        start,
        playsinline: '1',
        iv_load_policy: '3',
      }).toString();
      document.getElementById('yt').src = embed.toString();
    </script>
  </body>
</html>
